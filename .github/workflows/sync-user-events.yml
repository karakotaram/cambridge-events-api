name: Sync User Submitted Events

on:
  schedule:
    # Run daily at 8 AM UTC (3 AM EST / 4 AM EDT)
    - cron: '0 8 * * *'

  # Allow manual triggering from GitHub UI
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync user-submitted events
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          mkdir -p logs data
          python3 sync_user_events.py
          echo "Sync completed successfully"

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code data/events.json 2>/dev/null || echo "changed=true" >> $GITHUB_OUTPUT
          [ -f data/user_submitted_audit.html ] && echo "audit_exists=true" >> $GITHUB_OUTPUT || true

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add data/events.json
          # audit HTML is generated output and now gitignored; kept as a CI artifact instead
          true
          git commit -m "Sync user-submitted events - $(date +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing on origin/main and retrying..."
            git pull --rebase origin main
            sleep $((attempt * 10))
          done
          echo "Push failed after 3 attempts" >&2
          exit 1

      - name: No changes detected
        if: steps.git-check.outputs.changed != 'true'
        run: echo "No new user-submitted events to sync"
