name: Agent - Chat Quality

on:
  schedule:
    # Run daily at 7 AM UTC (after scrape at 6 AM, giving time for deploy)
    - cron: '0 7 * * *'

  workflow_dispatch:

jobs:
  test-chat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run chat quality agent
        run: |
          mkdir -p data/agent_reports
          python -m src.agents.chat_quality --base-url "$API_BASE_URL"
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
